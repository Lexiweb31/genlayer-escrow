name: Keep Render API warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Render API health
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 4 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 60 \
            https://genlayer-escrow.onrender.com/api/health
